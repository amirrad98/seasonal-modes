name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable version tag matching the plugin, for example v1.1.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: seasonal-modes-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/checks.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build exact version
        run: python3 scripts/build.py --tag "$RELEASE_TAG"
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-release-tag.sh "$RELEASE_TAG" "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Publish a new version instead of replacing an existing release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/seasonal-modes.zip dist/update.json \
            --target "$GITHUB_SHA" --title "Seasonal Modes $RELEASE_TAG" \
            --notes-file CHANGELOG.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
